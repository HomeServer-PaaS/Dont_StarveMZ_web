server.port=8080
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:guljima_mz_portal}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
spring.datasource.username=${MYSQL_USER:portal_app}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=8
mybatis.configuration.map-underscore-to-camel-case=true
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=1800
app.jwt.cookie-secure=${APP_COOKIE_SECURE:false}
app.demo-auth.enabled=${DEMO_AUTH_ENABLED:true}
